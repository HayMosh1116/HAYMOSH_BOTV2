<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haywhy Bot Network</title><style>
:root{color-scheme:dark;--line:#392d50;--purple:#b99cff;--muted:#aaa2ba}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2c1c4d,#090812 60%);color:#f7f3ff;font:15px system-ui;padding:30px 18px;min-height:100vh}main{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px}h1{font-size:clamp(25px,5vw,38px);margin:0}.sub,.label,.meta{color:var(--muted)}.sub{margin-top:7px}.badge,.status{border:1px solid var(--line);border-radius:30px;padding:8px 12px;color:var(--purple)}button{background:var(--purple);color:#160f25;border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.card,.bot{background:linear-gradient(145deg,#1c1730,#100e19);border:1px solid var(--line);border-radius:18px;padding:20px}.label{font-size:12px;text-transform:uppercase;letter-spacing:1px}.num{font-size:32px;font-weight:750;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.bothead{display:flex;justify-content:space-between;align-items:center;gap:8px}.bot h3{margin:0;font-size:18px}.status{font-size:11px;background:#143525;color:#80e4aa}.off{background:#401c29;color:#ff9eac}.meta{font-size:13px;line-height:1.9;margin-top:14px}.empty{text-align:center;padding:42px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}@media(max-width:560px){.stats{grid-template-columns:1fr}}</style></head><body><main><header class="top"><div><h1>✦ HAYWHY BOT NETWORK</h1><div class="sub">Unified fleet monitoring · Live heartbeat overview</div></div><div><span class="badge" id="updated">Connecting…</span> <button onclick="load()">Refresh</button></div></header><section class="stats"><div class="card"><div class="label">Registered bots</div><div class="num" id="total">—</div></div><div class="card"><div class="label">Online</div><div class="num" id="online">—</div></div><div class="card"><div class="label">Offline</div><div class="num" id="offline">—</div></div></section><section class="grid" id="bots"><div class="empty">Waiting for bot registrations…</div></section></main><script>
async function load(){try{const key=sessionStorage.getItem('networkKey')||prompt('Enter network API key');if(!key)return;sessionStorage.setItem('networkKey',key);const r=await fetch('/network/bots',{headers:{'x-network-key':key}});if(!r.ok)throw Error('Authentication failed');const d=await r.json(),a=d.bots||[];document.querySelector('#total').textContent=a.length;document.querySelector('#online').textContent=a.filter(x=>x.status==='online').length;document.querySelector('#offline').textContent=a.filter(x=>x.status!=='online').length;document.querySelector('#updated').textContent='Updated '+new Date().toLocaleTimeString();document.querySelector('#bots').innerHTML=a.length?a.map(b=>'<article class="bot"><div class="bothead"><h3>'+esc(b.name)+'</h3><span class="status '+(b.status==='online'?'':'off')+'">'+b.status.toUpperCase()+'</span></div><div class="meta">Owner: '+esc(b.owner||'Unknown')+'<br>Version: '+esc(b.version||'—')+'<br>Node: '+esc(b.node||'—')+'<br>Last heartbeat: '+new Date(b.lastSeen).toLocaleString()+'<br>Uptime: '+Math.floor((b.uptime||0)/3600)+'h '+Math.floor((b.uptime||0)%3600/60)+'m</div></article>').join(''):'<div class="empty">No bots registered yet. Configure network environment variables on each instance.</div>'}catch(e){document.querySelector('#updated').textContent=e.message}}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();setInterval(load,30000);
</script></body></html>
